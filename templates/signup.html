{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign Up — Career Traces</title>
<link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--g:#22c55e;--g2:#16a34a;--dark:#080c09;--s1:#0e1410;--s2:#141a15;--border:rgba(34,197,94,0.12);--border2:rgba(255,255,255,0.06);--t:#f0f7f1;--t2:#a8bfab;--t3:#607064;--f:'Plus Jakarta Sans',sans-serif;}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--t);font-family:var(--f);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-x:hidden}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.4}
.auth-bg{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(34,197,94,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,0.04) 1px,transparent 1px);background-size:55px 55px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent)}
.auth-glow{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:500px;height:400px;background:radial-gradient(ellipse,rgba(34,197,94,0.08) 0%,transparent 70%);pointer-events:none;z-index:0}
.auth-card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--s1);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(34,197,94,0.06),0 32px 80px rgba(0,0,0,0.5);animation:slideUp .5s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.auth-card-top{background:var(--s2);border-bottom:1px solid var(--border2);padding:1.75rem 2rem 1.5rem;text-align:center}
.auth-logo{width:48px;height:48px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);border-radius:12px;margin:0 auto .9rem;display:flex;align-items:center;justify-content:center}
.auth-logo img{width:28px;height:28px;object-fit:contain}
.auth-logo-dot{width:8px;height:8px;border-radius:50%;background:var(--g);animation:blink 2.5s ease-in-out infinite;display:block;margin:.15rem auto 0}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.4)}50%{opacity:0.4;box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.auth-brand{font-size:.75rem;color:var(--t3);font-weight:600;letter-spacing:.5px;margin-bottom:.3rem}
.auth-title{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;color:var(--t);margin-bottom:.3rem}
.auth-subtitle{font-size:.8rem;color:var(--t2);line-height:1.5}
.auth-card-body{padding:1.75rem 2rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.75rem;font-weight:600;color:var(--t2);margin-bottom:.4rem;letter-spacing:.2px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.78rem;pointer-events:none;transition:color .2s}
.form-input{width:100%;padding:.65rem .85rem .65rem 2.3rem;background:var(--s2);border:1px solid var(--border2);border-radius:9px;color:var(--t);font-size:.85rem;font-family:var(--f);transition:all .2s;outline:none}
.form-input:focus{border-color:rgba(34,197,94,0.4);box-shadow:0 0 0 3px rgba(34,197,94,0.08)}
.input-wrap:focus-within i{color:var(--g)}
.form-input::placeholder{color:var(--t3)}
.form-input.has-toggle{padding-right:2.5rem}
.input-wrap .toggle-pw{left:auto;right:.85rem;cursor:pointer;pointer-events:all}
.auth-alert{display:flex;align-items:flex-start;gap:.55rem;padding:.7rem .85rem;border-radius:8px;font-size:.78rem;line-height:1.5;margin-bottom:1.1rem}
.auth-alert i{margin-top:1px;flex-shrink:0;font-size:.75rem}
.auth-alert.error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#f87171}
.auth-alert.success{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);color:var(--g)}
.btn-submit{width:100%;padding:.75rem;border-radius:9px;background:var(--g);color:#000;border:none;font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--f);transition:all .25s;display:flex;align-items:center;justify-content:center;gap:.5rem;box-shadow:0 4px 16px rgba(34,197,94,0.25);margin-top:.25rem}
.btn-submit:hover{background:var(--g2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(34,197,94,0.35)}
.auth-divider{display:flex;align-items:center;gap:.75rem;margin:1.1rem 0;color:var(--t3);font-size:.72rem}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border2)}
.auth-footer-text{text-align:center;font-size:.78rem;color:var(--t2);margin-top:1.1rem}
.auth-footer-text a{color:var(--g);font-weight:600;text-decoration:none;transition:color .2s}
.auth-footer-text a:hover{color:var(--g2)}
.auth-card-footer{border-top:1px solid var(--border2);padding:.85rem 2rem;text-align:center;font-size:.72rem;color:var(--t3)}
.auth-card-footer a{color:var(--t3);text-decoration:none;margin:0 .5rem;transition:color .2s}
.auth-card-footer a:hover{color:var(--t)}
.strength-bar{height:3px;border-radius:2px;background:var(--border2);margin-top:.4rem;overflow:hidden}
.strength-fill{height:100%;border-radius:2px;width:0;transition:width .3s,background .3s}
.strength-label{font-size:.68rem;color:var(--t3);margin-top:.25rem;min-height:.85rem}
.terms-note{font-size:.72rem;color:var(--t3);text-align:center;margin-top:.85rem;line-height:1.5}
.terms-note a{color:var(--t2);text-decoration:underline}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="auth-bg"></div>
<div class="auth-glow"></div>

<div class="auth-card">
  <div class="auth-card-top">
    <div class="auth-logo">
      <img src="{% static 'img/logo.png' %}" alt="Career Traces"/>
    </div>
    <!-- <span class="auth-logo-dot"></span> -->
    <div class="auth-brand">Career Traces</div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Free forever. Start tracking in minutes.</p>
  </div>

  <div class="auth-card-body">
    <form method="post">
      {% csrf_token %}

      {% if error %}
      <div class="auth-alert error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
      {% endif %}

      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <input type="text" name="username" class="form-input" placeholder="Choose a username" required/>
          <i class="fas fa-user"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email address</label>
        <div class="input-wrap">
          <input type="email" name="email" class="form-input" placeholder="you@example.com" required/>
          <i class="fas fa-envelope"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input type="password" name="password" id="signupPw" class="form-input has-toggle" placeholder="Create a strong password" required oninput="checkStrength(this.value)"/>
          <i class="fas fa-lock"></i>
          <i class="fas fa-eye toggle-pw" id="toggleSignupPw" onclick="togglePassword('signupPw','toggleSignupPw')"></i>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-user-plus" style="font-size:.8rem"></i> Create Account
      </button>

      <p class="terms-note">By signing up, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
    </form>

    <div class="auth-divider">already have an account?</div>
    <div class="auth-footer-text">
      <a href="{% url 'login' %}">← Sign in instead</a>
    </div>
  </div>

  <div class="auth-card-footer">
    <a href="{% url 'default' %}">← Back to home</a>
  </div>
</div>

<script>
function togglePassword(inputId,iconId){const i=document.getElementById(inputId),ic=document.getElementById(iconId);if(i.type==='password'){i.type='text';ic.classList.replace('fa-eye','fa-eye-slash')}else{i.type='password';ic.classList.replace('fa-eye-slash','fa-eye')}}
function checkStrength(v){
  const fill=document.getElementById('strengthFill'),label=document.getElementById('strengthLabel');
  let score=0;
  if(v.length>=8)score++;if(v.length>=12)score++;if(/[A-Z]/.test(v))score++;if(/[0-9]/.test(v))score++;if(/[^A-Za-z0-9]/.test(v))score++;
  const levels=[{w:'0%',c:'transparent',l:''},{w:'25%',c:'#ef4444',l:'Weak'},{w:'50%',c:'#f59e0b',l:'Fair'},{w:'75%',c:'#60a5fa',l:'Good'},{w:'100%',c:'#22c55e',l:'Strong'}];
  const lvl=levels[Math.min(score,4)];
  fill.style.width=lvl.w;fill.style.background=lvl.c;
  label.textContent=lvl.l;label.style.color=lvl.c;
}
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let pts=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();window.addEventListener('resize',resize);
for(let i=0;i<45;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.4,o:Math.random()*.3+.05});
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(34,197,94,${p.o})`;ctx.fill()});pts.forEach((a,i)=>pts.forEach((b,j)=>{if(i>=j)return;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<100){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(34,197,94,${.05*(1-d/100)})`;ctx.stroke()}}));requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
